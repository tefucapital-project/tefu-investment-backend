name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://tefu:tefu@localhost:5432/tefu_investment?schema=public
          JWT_SECRET: ci-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-not-for-production

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify Prisma schema & entrypoint
        run: |
          test -f prisma/schema.prisma
          test -f src/server.ts
          test -f docker-entrypoint.sh

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Coolify production deployment
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.COOLIFY_WEBHOOK_PRODUCTION }}" ] || [ -z "${{ secrets.COOLIFY_TOKEN }}" ]; then
            echo "Missing COOLIFY_WEBHOOK_PRODUCTION or COOLIFY_TOKEN"
            exit 1
          fi
          # Coolify v4: GET /deploy returns 405 (POST required).
          curl --fail --show-error --request POST \
            --url "${{ secrets.COOLIFY_WEBHOOK_PRODUCTION }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
